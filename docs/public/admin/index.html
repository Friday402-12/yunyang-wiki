<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>郧中 Wiki · 内容后台</title>
    <link rel="icon" href="../logo.svg" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .boot {
        max-width: 560px;
        margin: 18vh auto 0;
        padding: 0 24px;
        color: #555;
        font-size: 14px;
        line-height: 1.8;
      }
      .boot-noscript {
        border-left: 3px solid #8c1f28;
        background: #faf3f4;
        border-radius: 0 8px 8px 0;
        padding: 12px 16px;
      }
    </style>
  </head>
  <body>
    <!--
      版本锁定说明（2026-10-24）：
      这里原本引用 unpkg 的 latest，国内加载时快时慢，而且上游一发新版就可能把后台弄坏。
      现在固定到具体版本号，并通过 jsDelivr（国内有节点）分发。
      升级方式：把下面 URL 里的 0.251.0 改成新版本号，改完用「登录 → 保存一篇草稿」验证一次。
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@sveltia/cms@0.251.0/dist/sveltia-cms.js"
      type="module"
    ></script>
    <noscript>
      <div class="boot boot-noscript">
        这个后台需要 JavaScript 才能运行。请换用 Chrome / Edge / Safari
        的较新版本，并确认没有开启「阻止脚本」。
      </div>
    </noscript>
  </body>
</html>
